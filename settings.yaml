# King-AI-video 偏好设置（不含密钥，可随意备份/分享）
# 值必须写在一行内；改完保存本文件、重启服务即生效；
# 网页「凭据与依赖」页保存时也会写回这里，两边同源。
#
# 生图风格提示词：会自动拼接到每条生图提示词之后，统一全片画风。
IMAGE_STYLE_PROMPT: ""
#
# 改写文风指令：追加进 DeepSeek 改写的 system prompt，全局定制口吻/句式/禁忌词；
# 留空 = 只用内置七种内容类型模板。
REWRITE_STYLE_PROMPT: ""
#
# 字幕字号缩放系数：合法 0.7~1.5，留空 = 默认 1.0；乘在自适应基准字号上。
SUBTITLE_FONT_SIZE: "1.45"
#
# 字幕字体族：只认白名单（Microsoft YaHei / SimHei / Source Han Sans SC / KaiTi / SimSun），
# 留空或非白名单 = 默认 Microsoft YaHei。
SUBTITLE_FONT_NAME: "KaiTi"
SUBTITLE_FONT_SIZE_PORTRAIT: "1"
SUBTITLE_FONT_SIZE_LANDSCAPE: "1.45"
ARK_IMAGE_MODEL: "doubao-seedream-3-0-t2i-250415"
