# King-AI-video 凭据配置模板
# 用法：把本文件复制为同目录下的 credentials.yaml，填入你的密钥即可。
#   Windows 资源管理器：复制 → 粘贴 → 重命名为 credentials.yaml
#   或在「凭据与依赖」页保存一次，系统会自动生成 credentials.yaml。
# credentials.yaml 含明文密钥，已在 .gitignore 忽略，切勿提交或分享。
#
# 只填你要用的，其余留空即可。

# 写稿 AI（三选一）：
DEEPSEEK_API_KEY: ""
OPENAI_API_KEY: ""
ANTHROPIC_API_KEY: ""

# 豆包配音——新版控制台（快捷API接入）只填 APIKEY 一项；旧版填 APPID + TOKEN：
VOLC_TTS_APIKEY: ""
VOLC_TTS_APPID: ""
VOLC_TTS_TOKEN: ""

# Pexels 素材下载（在 pexels.com/api 免费注册获取）：
PEXELS_API_KEY: ""
